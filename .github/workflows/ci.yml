name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: backend typecheck
        run: pnpm backend:typecheck

      - name: backend test
        run: pnpm backend:test

      - name: frontend typecheck (astro)
        run: pnpm --filter @rss-summary/frontend typecheck

      - name: frontend typecheck (worker)
        run: pnpm --filter @rss-summary/frontend typecheck:worker

      - name: frontend unit test
        run: pnpm --filter @rss-summary/frontend test

      - name: frontend local e2e (実workerd + 実(ローカル)D1、secrets不要)
        run: pnpm --filter @rss-summary/frontend test:e2e

      # フォークからのPRではrepository secretsが渡されないため、このステップはスキップする
      # (以降のジョブは失敗させない。ビルド検証はsecretsを登録できるpush/同一リポジトリのPRのみ)
      - name: frontend build
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm --filter @rss-summary/frontend build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
