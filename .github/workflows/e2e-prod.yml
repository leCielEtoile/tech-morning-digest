name: E2E (実環境スモークテスト)

# デプロイ自体はこのリポジトリのCI経由では行われない(手動 or Workers Builds側)ため、
# push/pull_requestには連動させない。手動実行と定期実行のみ。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # UTC 03:00(既存のbuildクローンcron 23:30・watchdog 02:00の後)

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # PROD_BASE_URL(repository variable)が未登録だとsmoke.test.tsの全テストが
      # スキップされ、jobは何も検証しないまま成功扱いになる(過去のsecrets消失障害と
      # 同じ「監視が無言で機能停止する」失敗モード)。未登録ならここで明示的に落とす。
      - name: PROD_BASE_URL登録確認
        run: test -n "${{ vars.PROD_BASE_URL }}" || { echo "::error::repository variable PROD_BASE_URLが未登録です"; exit 1; }

      - name: 実環境スモークテスト
        run: pnpm --filter @rss-summary/frontend test:e2e:prod
        env:
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
